name: Carduri în loc de stoc/AI

# Articolele din ultimele 14 zile cu poză de stoc / AI despre state, politicieni,
# instituții -> cardul cu steaguri (scripts/pipeline/recard.ts). Pornit manual;
# implicit doar afișează.
on:
  workflow_dispatch:
    inputs:
      aplica:
        description: "Aplică schimbările (altfel doar le afișează)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/pipeline/recard.ts ${{ inputs.aplica && '--aplica' || '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
