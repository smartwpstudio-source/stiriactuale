name: Verificare conținut

# Pe fiecare Pull Request (ghiduri, contacte de raion/țară scrise în cloud):
# validarea conținutului + verificarea tipurilor. Un PR roșu nu se aprobă.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npx next typegen # PageProps/LayoutProps — generate, nu sunt în repo
      - run: npx tsc --noEmit -p .
