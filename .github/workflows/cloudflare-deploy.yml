name: Deploy Cloudflare Workers

# Build-ul OpenNext pe Linux și `wrangler deploy` pe Cloudflare Workers.
# DEOCAMDATĂ DOAR MANUAL (Actions → Deploy Cloudflare Workers → Run workflow), nu la
# fiecare push: site-ul live e încă pe Vercel. Pașii de comutare: docs/cloudflare-migrare.md.
#
# Secrete necesare în GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token cu „Edit Cloudflare Workers” + R2 + (opțional) Cache Purge
#   CLOUDFLARE_ACCOUNT_ID  ID-ul contului Cloudflare
#   DATABASE_URL           la build se pre-randează pagini din bază (doar citire)
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY, NEXT_PUBLIC_ADSENSE_CLIENT_ID — intră în JS-ul din browser la build
# Secretele de rulare (TELEGRAM_*, CRON_SECRET, VAPID_PRIVATE_KEY...) NU trec pe aici: se pun
# o singură dată în worker cu `wrangler secret put` (vezi documentul).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Doar build + wrangler deploy --dry-run (nu publică nimic)"
        type: boolean
        default: true
      production:
        description: "Comutarea: pune și secretele de publicare (canal Telegram, Facebook)"
        type: boolean
        default: false

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # binding-ul HYPERDRIVE (baza Supabase): la build/populare wrangler cere o adresă directă
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:content

      - name: Build (Next.js + OpenNext + conținutul în assets)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: "Mărimea worker-ului (limita Workers Paid, 10 MiB comprimat)"
        run: npx wrangler deploy --dry-run --outdir .wrangler/dist | tail -5

      # deploy = populează cache-ul R2 cu paginile pre-randate + încarcă worker-ul
      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Secretele de rulare, din secretele GitHub. Pe adresa de test (staging) FĂRĂ
      # TELEGRAM_CHANNEL_ID și Facebook: nimic nu se postează public de acolo.
      # La comutare: input-ul `production` = true le adaugă și pe ele.
      - name: Secretele worker-ului
        if: ${{ !inputs.dry_run }}
        run: |
          node -e '
            const keys = ["DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_ADMIN_CHAT_ID","ADMIN_PASSWORD","CRON_SECRET",
              "NEXT_PUBLIC_VAPID_PUBLIC_KEY","VAPID_PRIVATE_KEY","BLOB_READ_WRITE_TOKEN","MAGNIFIC_API_KEY","GITHUB_DISPATCH_TOKEN"];
            if (process.env.PRODUCTION === "true") keys.push("TELEGRAM_CHANNEL_ID","FACEBOOK_PAGE_ID","FACEBOOK_PAGE_TOKEN");
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            console.log("secrete: " + Object.keys(out).join(", "));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION: ${{ inputs.production }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }} # GitHub nu permite secrete care încep cu GITHUB_
