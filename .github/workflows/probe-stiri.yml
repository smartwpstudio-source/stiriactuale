# Test temporar: stiri.md răspunde serverelor GitHub? (se șterge după test)
name: Probe stiri.md
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for url in \
            "https://ipn.md/" \
            "https://stiri.md/" \
            "https://stiri.md/article/politica/noua-structura-si-efectivul-armatei-nationale-examinate-in-secret-de-deputati" \
            "https://point.md/" \
            "https://stiri.md/robots.txt"; do
            for i in 1 2; do
              r=$(curl -s -L -m 15 -A "$UA" -o /dev/null -w "%{http_code} %{size_download}B %{time_total}s" "$url"); echo "REZ $? | $r | $url"
            done
          done
