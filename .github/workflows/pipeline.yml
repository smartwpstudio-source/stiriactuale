name: Pipeline stiri

# Pornit de cron-ul Vercel (vercel.json -> /api/cron/pipeline/) la 06:00-22:00
# Chișinău, din 2 în 2 ore, exact la oră. Orarul GitHub (schedule) întârzia
# cu ore, așa că a fost scos. Noaptea, run.ts nu publică oricum.
#
# Pipeline-ul rulează AICI (nu pe Vercel): fără limita de 300s, iar apelurile
# către Claude folosesc creditul Agent SDK al abonamentului Max prin
# CLAUDE_CODE_OAUTH_TOKEN. Oprire de urgență: Actions -> "Pipeline stiri" ->
# ... -> Disable workflow.
on:
  workflow_dispatch: {} # Vercel cron + rulare manuală

# Două rulări suprapuse ar produce duplicate — a doua așteaptă.
concurrency: pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pipeline:run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # publicarea automată postează în canal și trimite notificări push
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
