name: Pipeline stiri

# Fereastră activă 06:00-22:00 Chișinău, 9 rulări/zi — decizie finală, vezi
# plan-implementare-agregator-stiri-ai.md secțiunea 3.8. Orele sunt în UTC,
# calculate pentru ora de vară (UTC+3); un derapaj de max. o oră față de ora
# Chișinăului de două ori pe an (schimbarea orei) e acceptat ca irelevant.
on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Chisinau
    - cron: "0 5 * * *" # 08:00
    - cron: "0 7 * * *" # 10:00
    - cron: "0 9 * * *" # 12:00
    - cron: "0 11 * * *" # 14:00
    - cron: "0 13 * * *" # 16:00
    - cron: "0 15 * * *" # 18:00
    - cron: "0 17 * * *" # 20:00
    - cron: "0 19 * * *" # 22:00
  workflow_dispatch: {} # rulare manuală, pentru testare

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Apeleaza endpoint-ul de pipeline
        env:
          # vars.PIPELINE_URL (Settings -> Secrets and variables -> Actions -> Variables)
          # permite testare pe un URL de preview Vercel înainte de comutarea
          # domeniului live, fără să editezi acest fișier. Implicit: domeniul final.
          # Slash-ul final e obligatoriu (trailingSlash: true în next.config.ts) —
          # fără el, request-ul primește un 308 și pipeline-ul nu se declanșează.
          PIPELINE_URL: ${{ vars.PIPELINE_URL || 'https://stiriactuale.info/api/pipeline/run/' }}
        run: |
          curl -f -X POST "$PIPELINE_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
