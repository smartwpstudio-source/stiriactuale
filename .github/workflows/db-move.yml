name: Mutarea bazei pe Supabase

# Mutarea bazei de date de pe Neon (limita gratuită de ore de calcul) pe Supabase
# Free (2026-10-14). Doar manual: Actions -> „Mutarea bazei pe Supabase” -> Run workflow.
# Secretele: DATABASE_URL (Neon, sursa) și SUPABASE_DATABASE_URL (Session pooler,
# destinația). Adresele nu apar în loguri (GitHub le maschează).
#   pas = copiere  -> structura (migrațiile drizzle) + datele, apoi numărătoarea pe tabele
#   pas = hyperdrive -> configurația Hyperdrive pentru worker (id-ul apare în log)
on:
  workflow_dispatch:
    inputs:
      pas:
        description: "copiere | hyperdrive | verificare | migrare"
        type: choice
        options: [copiere, hyperdrive, hyperdrive-limita, verificare, cron, migrare]
        default: copiere

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Clientul PostgreSQL 18 (ca serverul Neon)
        if: ${{ inputs.pas == 'copiere' }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version

      - name: Copierea
        if: ${{ inputs.pas == 'copiere' }}
        env:
          SRC: ${{ secrets.DATABASE_URL }}
          DST: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/18/bin
          [ -n "$DST" ] || { echo "lipsește secretul SUPABASE_DATABASE_URL"; exit 1; }
          case "$SRC" in *neon.tech*) ;; *) echo "DATABASE_URL nu mai e Neon — copierea s-a făcut deja?"; exit 1;; esac
          # SIGURANȚA: proiectul Supabase e comun cu alt site (tabelele lui stau în „public”).
          # Site-ul lucrează DOAR în schema „stiriactuale”, cu utilizatorul lui (search_path =
          # stiriactuale, extensions). Dacă conexiunea nu e așa configurată, nu atinge nimic.
          SCHEMA=$($PG/psql "$DST" -Atc "select current_schema()")
          [ "$SCHEMA" = "stiriactuale" ] || { echo "STOP: schema curentă e „$SCHEMA”, nu „stiriactuale” — utilizatorul nu e configurat"; exit 1; }
          OURS=$($PG/psql "$SRC" -Atc "select tablename from pg_tables where schemaname = 'public' order by 1")
          FOREIGN=$($PG/psql "$DST" -Atc "select tablename from pg_tables where schemaname = 'stiriactuale' order by 1" | grep -vxF "$OURS" || true)
          if [ -n "$FOREIGN" ]; then echo "STOP: schema stiriactuale are tabele străine:"; echo "$FOREIGN"; exit 1; fi
          # structura: aceleași migrații, fără „public.” (tipurile intră în schema stiriactuale)
          sed -i 's/"public"\.//g' drizzle/*.sql
          DATABASE_URL="$DST" npx drizzle-kit migrate
          # o nouă rulare golește întâi DOAR tabelele site-ului (copierea finală, la comutare)
          TABLES=$(echo "$OURS" | sed 's/.*/stiriactuale."&"/' | paste -sd, -)
          $PG/psql "$DST" -v ON_ERROR_STOP=1 -qc "truncate $TABLES restart identity"
          # datele: din public (Neon) în stiriactuale (Supabase) — doar comenzile COPY și
          # setval se rescriu, textul articolelor rămâne neatins
          $PG/pg_dump "$SRC" --data-only --schema=public --no-owner --no-privileges \
            | sed -e '/^SET transaction_timeout/d' -e "/^SELECT pg_catalog.set_config('search_path'/d" \
                  -e 's/^COPY public\./COPY stiriactuale./' -e "s/^SELECT pg_catalog.setval('public\./SELECT pg_catalog.setval('stiriactuale./" \
            | $PG/psql "$DST" -v ON_ERROR_STOP=1 -q
          echo "tabel | Neon | Supabase"
          for t in $OURS; do
            a=$($PG/psql "$SRC" -Atc "select count(*) from public.\"$t\"")
            b=$($PG/psql "$DST" -Atc "select count(*) from stiriactuale.\"$t\"")
            echo "$t | $a | $b"; [ "$a" = "$b" ] || { echo "DIFERENȚĂ la $t"; exit 1; }
          done
          echo "copiere: OK"

      # migrațiile noi din drizzle/ (ex. 0027: pozele din corpul articolului), doar în
      # schema site-ului — același control ca la copiere, proiectul Supabase e comun
      - name: Migrarea
        if: ${{ inputs.pas == 'migrare' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in *supabase*) ;; *) echo "STOP: DATABASE_URL nu e Supabase"; exit 1;; esac
          SCHEMA=$(node -e 'const s=require("postgres")(process.env.DATABASE_URL,{max:1});s`select current_schema() as c`.then(r=>{console.log(r[0].c);return s.end()})')
          [ "$SCHEMA" = "stiriactuale" ] || { echo "STOP: schema curentă e „$SCHEMA”, nu „stiriactuale”"; exit 1; }
          sed -i 's/"public"\.//g' drizzle/*.sql
          npx drizzle-kit migrate
          echo "migrare: OK"

      - name: Hyperdrive
        if: ${{ inputs.pas == 'hyperdrive' }}
        env:
          DST: ${{ secrets.SUPABASE_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # fără cache de interogări: admin-ul și pipeline-ul văd imediat ce s-a scris
        run: npx wrangler hyperdrive create stiriactuale-db --connection-string="$DST" --caching-disabled

      # verifică adresele fără să le afișeze: se pot citi ca URL? ce fel de caractere are parola?
      - name: Verificarea adreselor
        if: ${{ inputs.pas == 'verificare' }}
        env:
          A: ${{ secrets.DATABASE_URL }}
          B: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: node scripts/db-url-check.mjs

      # apelează rutele cron ale site-ului ca programarea Cloudflare (diagnostic)
      - name: Rutele cron
        if: ${{ inputs.pas == 'cron' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for p in "/api/cron/pipeline/" "/api/cron/digest/?tip=dimineata" "/api/cron/collect/"; do
            echo "== $p"; curl -s -m 60 -w "  [HTTP %{http_code}]" -H "authorization: Bearer $CRON_SECRET" "https://stiriactuale.info$p" | head -c 400; echo
          done

      # Session pooler-ul Supabase are 15 conexiuni în total: Hyperdrive (site) ține cel mult 5,
      # restul rămân pentru pipeline (GitHub) și build
      - name: Limita de conexiuni Hyperdrive
        if: ${{ inputs.pas == 'hyperdrive-limita' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler hyperdrive update 3ef3a98a5cff4ca7a051e8b6d4164ae3 --origin-connection-limit 5
